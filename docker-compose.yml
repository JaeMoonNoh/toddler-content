# 로컬 실행: docker compose up --build
# 값을 바꾸고 싶으면 .env.example을 .env로 복사해서 수정

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-toddler}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-toddler}
      POSTGRES_DB: ${POSTGRES_DB:-toddler}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    # PID 1을 tini에 맡긴다. node는 PID 1일 때 SIGTERM을 무시하고, 종료된 자식 프로세스(좀비)를 거두지 않는다
    init: true
    # 새벽 수집 도중에 멈추면 수집이 끝날 때까지 기다린다 (기본 10초는 짧다)
    stop_grace_period: 2m
    # 공공데이터포털 인증키(DATA_GO_KR_SERVICE_KEY)를 여기서 읽는다. 아래 environment 값이 우선한다
    env_file:
      - path: apps/api/.env
        required: false
    environment:
      PORT: 4000
      WEB_ORIGIN: http://localhost:3000
      DATABASE_URL: postgres://${POSTGRES_USER:-toddler}:${POSTGRES_PASSWORD:-toddler}@db:5432/${POSTGRES_DB:-toddler}
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    init: true
    environment:
      # 컨테이너끼리는 서비스 이름으로 통신
      API_INTERNAL_URL: http://api:4000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  db-data:
